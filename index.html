<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Business Desk</title>
<meta name="theme-color" content="#0c1418" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6f6" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Business Desk">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* Layout idea: an editorial front page. Ticker on top, numbered "60 seconds", then sections in reading order: Worldwide, Africa, Congo.
   Colour in markets means effect on costs, never just up/down. */
:root{
  --bg:#f4f6f6; --surface:#ffffff; --sunk:#eaeeef; --line:#dde3e5; --text:#10181c; --muted:#5d6b71;
  --accent:#a8741a; --accent-soft:#f5ead6; --on-accent:#ffffff;
  --relief:#1d7a4c; --pressure:#b4561a; --critical:#b42318; --critical-soft:#fdecea;
  --display:"New York","Iowan Old Style",Georgia,serif; --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1418; --surface:#14212a; --sunk:#0f1a20; --line:#22333b; --text:#e9eef0; --muted:#8fa2a9;
  --accent:#d9a441; --accent-soft:#33291a; --on-accent:#1b1408;
  --relief:#6fcf97; --pressure:#f2994a; --critical:#ff8a80; --critical-soft:#3a1b1b; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c1418; --surface:#14212a; --sunk:#0f1a20; --line:#22333b; --text:#e9eef0; --muted:#8fa2a9;
  --accent:#d9a441; --accent-soft:#33291a; --on-accent:#1b1408;
  --relief:#6fcf97; --pressure:#f2994a; --critical:#ff8a80; --critical-soft:#3a1b1b; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left)) calc(100px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-right))}

/* Masthead + ticker */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.mast{max-width:640px;margin:0 auto;padding:10px 18px 6px;display:flex;align-items:flex-end;gap:12px}
.mast .grow{flex:1;min-width:0}
.dateline{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mast h1{font-family:var(--display);font-size:1.7rem;line-height:1.05;margin:2px 0 0;font-weight:700;letter-spacing:-.01em}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:32px;min-width:32px;padding:0 10px;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.ticker{max-width:640px;margin:0 auto;display:flex;gap:18px;overflow-x:auto;padding:6px 18px 9px;scrollbar-width:none;font-size:.8rem;white-space:nowrap}
.ticker::-webkit-scrollbar{display:none}
.tk{display:flex;gap:6px;align-items:baseline;flex:none}
.tk b{font-weight:600}
.tk .v{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Typography */
h2.sec{font-family:var(--display);font-size:1.45rem;line-height:1.15;margin:0;font-weight:700;text-wrap:balance}
.kicker{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.sub{color:var(--muted);font-size:.88rem;margin:4px 0 0}
section{padding-top:26px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:2px solid var(--text);margin-bottom:4px}
.see{font-size:.84rem;color:var(--accent);text-decoration:none;font-weight:600;white-space:nowrap}

/* Banner */
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:12px;font-size:.86rem;margin-top:14px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.banner b{color:var(--text)}
.banner.hit{background:var(--critical-soft);border-color:var(--critical);color:var(--text)}
.banner.stale{border-color:var(--pressure)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}
.banner.hit .dot{background:var(--critical)} .banner.stale .dot{background:var(--pressure)}

/* 60 seconds */
.lead{display:grid;gap:4px;padding:16px 0;border-bottom:1px solid var(--line)}
.lead:last-child{border-bottom:0}
.lead .n{font-family:var(--display);font-size:1.7rem;line-height:1;color:var(--accent);font-weight:700;grid-row:span 4}
.lead h3{margin:0;font-size:1.04rem;line-height:1.35;font-weight:650;text-wrap:balance}
.lead p{margin:0;font-size:.9rem;color:var(--muted)}
.lead .imp{font-size:.92rem;margin-top:4px}
.lead .imp b{color:var(--accent)}
.tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:.74rem}
.tag{padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}
.tag.high{background:var(--critical-soft);color:var(--critical)}
.tag.med{background:var(--accent-soft);color:var(--accent)}
.tags a{color:var(--muted)}
/* 60 seconds as a story reel */
.reel{position:relative;height:min(68vh,560px);border-radius:22px;overflow:hidden;background:#0b1630;color:#fff;margin-top:12px;touch-action:pan-y;user-select:none;-webkit-user-select:none;box-shadow:0 12px 32px rgba(0,0,0,.2);outline:none}
.reel.full{position:fixed;inset:0;height:auto;border-radius:0;z-index:300;margin:0;touch-action:none}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:44px 22px calc(20px + env(safe-area-inset-bottom));transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s;will-change:transform}
.reel.full .slide{padding-top:calc(52px + env(safe-area-inset-top))}
.slide[data-pos=prev]{transform:translateX(-100%);opacity:.4}.slide[data-pos=next]{transform:translateX(100%);opacity:.4}
.reel.full .slide[data-pos=prev]{transform:translateY(-100%)}.reel.full .slide[data-pos=next]{transform:translateY(100%)}
.slide::before{content:"";position:absolute;inset:0;background:radial-gradient(110% 55% at 100% 0,rgba(255,255,255,.22),transparent 60%),radial-gradient(90% 50% at 0 100%,rgba(0,0,0,.35),transparent 70%);pointer-events:none}
.bars{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:4px;z-index:6}
.reel.full .bars{top:calc(10px + env(safe-area-inset-top))}
.bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.32);overflow:hidden}
.bars b{display:block;height:100%;width:0;background:#fff}
.s-top{display:flex;align-items:center;gap:8px;padding-right:84px;position:relative;z-index:3;flex-wrap:wrap}
.s-cat{font-size:.74rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;background:rgba(255,255,255,.18);padding:6px 11px;border-radius:999px}
.s-hot{font-size:.7rem;font-weight:800;background:#fff;color:#111;padding:5px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em}
.s-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;position:relative;z-index:1}
.s-emoji{font-size:3.4rem;line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.3))}
.slide h3{margin:0;font-family:var(--display);font-size:clamp(1.5rem,6.8vw,2.2rem);line-height:1.16;font-weight:700;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.slide p{margin:0;font-size:1rem;line-height:1.45;opacity:.9}
.s-imp b{background:rgba(255,255,255,.22);padding:2px 8px;border-radius:6px;margin-right:6px;font-size:.78rem}
.s-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.84rem;position:relative;z-index:4}
.s-foot span{opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-go{background:#fff;color:#111;text-decoration:none;font-weight:700;padding:11px 18px;border-radius:999px;white-space:nowrap;flex:none}
.s-nav{position:absolute;top:0;bottom:80px;border:0;background:none;z-index:2;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}
.s-nav.prev{left:0;width:32%}.s-nav.next{right:0;width:68%}
.s-btn{position:absolute;top:30px;z-index:6;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.28);color:#fff;font-size:.8rem;cursor:pointer;display:grid;place-items:center}
.reel.full .s-btn{top:calc(26px + env(safe-area-inset-top))}
.s-pp{right:54px}.s-full{right:14px;font-size:1rem}
.s-hint{position:absolute;bottom:calc(74px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:.72rem;opacity:.6;z-index:3;pointer-events:none}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}
/* Today: photo cards */
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.ov{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(0,0,0,.5) 0,rgba(0,0,0,.12) 28%,rgba(0,0,0,.3) 55%,rgba(0,0,0,.9) 100%)}
.slide.has-img .s-emoji,.pc.has-img .c-emoji{display:none}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px calc(-1*max(18px,env(safe-area-inset-left))) 0;padding:2px max(18px,env(safe-area-inset-left)) 8px;scroll-padding-left:max(18px,env(safe-area-inset-left));scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.pc{flex:none;position:relative;width:min(76%,300px);height:380px;border-radius:20px;overflow:hidden;color:#fff;text-decoration:none;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:16px;box-shadow:0 8px 22px rgba(0,0,0,.16);transition:transform .15s}
.pc:active{transform:scale(.98)}
.pc h3,.pc p,.pc .c-meta,.pc .c-emoji,.pc .c-year,.pc .c-day,.pc .c-mon,.pc .c-in,.pc .c-date{position:relative;z-index:1}
.pc .c-top{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:6px;z-index:1}
.pc .c-chip{font-size:.66rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;background:rgba(0,0,0,.38);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:5px 9px;border-radius:999px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .c-emoji{font-size:2.6rem;line-height:1;margin:40px 0 auto}
.pc h3{margin:0;font-family:var(--display);font-size:1.3rem;line-height:1.2;font-weight:700;text-wrap:balance;text-shadow:0 2px 10px rgba(0,0,0,.35);display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.pc .c-meta{font-size:.76rem;opacity:.88;display:flex;gap:6px;white-space:nowrap}
.pc.otd .c-year{font-family:var(--display);font-size:2.6rem;font-weight:700;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.pc.otd p{margin:0;font-size:.96rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.pc.ag{height:196px;width:min(58%,230px);justify-content:space-between}
.pc.ag .c-day{font-family:var(--display);font-size:2.5rem;font-weight:700;line-height:1}
.pc.ag .c-mon{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;opacity:.85;margin-top:2px}
.pc.ag p{margin:0;font-size:.94rem;line-height:1.3;font-weight:600}
.pc.ag .c-in{position:absolute;top:14px;right:14px;font-size:.7rem;font-weight:700;background:rgba(255,255,255,.2);padding:4px 9px;border-radius:999px}
.pc.ag .c-emoji{position:absolute;right:12px;bottom:56px;margin:0;font-size:2.2rem;opacity:.9}
/* Watch: TikTok-style full-screen feed with voice */
.w-open{display:inline-flex;align-items:center;gap:8px;margin-top:12px;border:0;border-radius:999px;padding:11px 18px;font-size:.92rem;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(90deg,#ff2d55,#ff7a18);box-shadow:0 6px 18px rgba(255,45,85,.35)}
.w-open .pl{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:.7rem}
.watch{position:fixed;inset:0;z-index:400;background:#000;color:#fff;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.watch::-webkit-scrollbar{display:none}
.wv{position:relative;height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:0 20px calc(34px + env(safe-area-inset-bottom)) 18px;-webkit-user-select:none;user-select:none}
.wv .kb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;transform:scale(1.08)}
.wv.on .kb{animation:kb1 16s ease-out forwards}
.wv:nth-of-type(even).on .kb{animation-name:kb2}
@keyframes kb1{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.22) translate(-3%,-2%)}}
@keyframes kb2{from{transform:scale(1.22) translate(3%,1%)}to{transform:scale(1.04) translate(0,0)}}
.wv .ov2{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(0,0,0,.6) 0,rgba(0,0,0,.05) 22%,rgba(0,0,0,.15) 45%,rgba(0,0,0,.92) 100%)}
.wv .w-emoji{position:absolute;top:24%;left:0;right:0;text-align:center;font-size:6.5rem;z-index:1;filter:drop-shadow(0 10px 30px rgba(0,0,0,.4))}
.wv.on .w-emoji{animation:wfloat 3.5s ease-in-out infinite}
@keyframes wfloat{50%{transform:translateY(-14px) rotate(-4deg)}}
.w-body{position:relative;z-index:2;display:flex;flex-direction:column;gap:12px}
.w-cat{align-self:flex-start;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:6px 11px;border-radius:999px}
.wv h2{margin:0;font-family:var(--display);font-size:clamp(1.6rem,7.2vw,2.4rem);line-height:1.15;font-weight:700;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.wv h2 span{opacity:.32;transition:opacity .18s}
.wv h2 span.lit{opacity:1}
.w-imp{margin:0;font-size:1rem;line-height:1.45;opacity:.92}
.w-meta{font-size:.84rem;opacity:.85}
.w-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.18);z-index:3}
.w-bar b{display:block;height:100%;width:0;background:#fff}
.w-rail{position:absolute;right:10px;bottom:calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;z-index:4;align-items:center}
.w-rail button,.w-rail a{width:60px;display:grid;justify-items:center;gap:4px;background:none;border:0;color:#fff;font-size:.68rem;font-weight:700;text-decoration:none;cursor:pointer;text-shadow:0 1px 4px rgba(0,0,0,.6);padding:0}
.w-rail .ic{width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.38);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;font-size:1.35rem;transition:transform .15s,background .2s}
.w-rail button:active .ic,.w-rail a:active .ic{transform:scale(.88)}
.w-rail .liked .ic{background:#ff2d55}.w-rail .saved .ic{background:#f5a524}
.w-top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 14px 0;z-index:6;pointer-events:none}
.w-top>*{pointer-events:auto}
.w-title{font-weight:800;letter-spacing:.05em;font-size:.86rem;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.w-x,.w-snd{width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.4);color:#fff;font-size:1.05rem;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.w-pause{position:absolute;inset:0;display:grid;place-items:center;z-index:3;pointer-events:none;opacity:0;transition:opacity .2s}
.w-pause i{width:84px;height:84px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;font-style:normal;font-size:2rem}
.wv.paused .w-pause{opacity:1}
.burst{position:absolute;z-index:7;font-size:6.5rem;pointer-events:none;animation:burst .9s ease-out forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.2) rotate(-15deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15) rotate(-8deg);opacity:1}100%{transform:translate(-50%,-110%) scale(.9) rotate(0);opacity:0}}
.w-end{background:radial-gradient(120% 80% at 50% 0,#2a3b8f,#05070f)}
.w-end .w-body{align-items:center;text-align:center;margin-bottom:30vh}
.w-btn{border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:.95rem;cursor:pointer;background:#fff;color:#111}
.w-btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.w-toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:9px 16px;border-radius:999px;font-size:.85rem;z-index:8;pointer-events:none;animation:toast 1.6s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}15%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.wv.on .kb,.wv.on .w-emoji{animation:none}}
/* News: a calm reading list built for a daily habit */
/* News: no sideways scroll */
.nx-row>div{min-width:0}.nx-meta .s{min-width:0;flex:0 1 auto}.view{overflow-x:clip}
/* Today: energetic hero */
.hero{margin-top:14px;border-radius:18px;overflow:hidden;color:#eef2f8;background:linear-gradient(160deg,#0f1b33 0%,#15284a 60%,#1c3157 100%);border:1px solid rgba(255,255,255,.06);box-shadow:0 10px 28px rgba(15,27,51,.28);position:relative}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(#d9a441,#a8741a)}
.h-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 0 20px;font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#d9a441}
.h-top span:last-child{white-space:nowrap;color:#9fb0c8;letter-spacing:.04em;font-weight:600;text-transform:none;font-size:.74rem;font-family:var(--mono)}
.h-hi{margin:8px 16px 0 20px;font-family:var(--display);font-size:1.55rem;line-height:1.15;font-weight:700;color:#fff}
.h-sub{margin:6px 16px 0 20px;font-size:.9rem;line-height:1.45;color:#b9c6d9}
.h-take{color:#e6ecf5;font-size:.92rem}
.h-sig{display:flex;align-items:center;gap:10px;margin:14px 16px 0 20px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);font-size:.86rem;line-height:1.35}
.h-sig i{flex:none;width:10px;height:10px;border-radius:50%;background:#9fb0c8;box-shadow:0 0 0 4px rgba(159,176,200,.15)}
.h-sig.relief i{background:#4ade80;box-shadow:0 0 0 4px rgba(74,222,128,.18)}.h-sig.pressure i{background:#fb923c;box-shadow:0 0 0 4px rgba(251,146,60,.18)}
.h-sig b{color:#fff}.h-sig span{color:#b9c6d9}
.h-play{display:flex;align-items:center;gap:12px;width:calc(100% - 36px);margin:14px 16px 16px 20px;border:0;border-radius:12px;padding:11px 14px;background:#d9a441;color:#14110a;cursor:pointer;text-align:left;font:inherit}
.h-play:active{transform:scale(.99)}.h-play[disabled]{opacity:.55;cursor:default}
.h-btn{flex:none;width:34px;height:34px;border-radius:50%;background:#14110a;color:#d9a441;display:grid;place-items:center;font-size:.8rem;padding-left:3px}
.h-play b{display:block;font-size:.98rem}.h-play span.s{display:block;font-size:.76rem;opacity:.75;margin-top:1px}
.movers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.mv{border:1px solid var(--line);border-radius:16px;padding:11px 11px 8px;background:var(--surface);text-decoration:none;color:inherit;display:grid;gap:3px;min-width:0;position:relative;overflow:hidden}
.mv .n{font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .v{font-family:var(--mono);font-size:1.12rem;font-weight:700}

.save{background:none;border:0;padding:4px;cursor:pointer;color:var(--muted);flex:none}
.save[aria-pressed="true"]{color:var(--accent)}
.save svg{width:20px;height:20px;display:block}
.story.top h3{font-family:var(--display);font-size:1.22rem;font-weight:700}
.empty{padding:22px 0;color:var(--muted);font-size:.9rem}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none;position:sticky;top:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.84rem;cursor:pointer;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}

/* Markets */
.mgroup{margin-top:20px}
.mgroup h3{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
.mlist{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mrow{display:grid;grid-template-columns:1fr 88px 96px;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.mrow:first-child{border-top:0}
.mrow .nm{font-weight:600;font-size:.95rem}
.mwhy{grid-column:1/-1;margin-top:-2px;font-size:.8rem;line-height:1.4;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mwhy b{font-size:.7rem;color:var(--text)}.mwhy span{opacity:.75}
.mrow .un{font-size:.72rem;color:var(--muted)}
.mrow svg{width:88px;height:30px;display:block}
.mrow .px{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.mrow .px .v{font-size:1rem}
.mrow .px .c{font-size:.76rem}
.mrow.tripped{box-shadow:inset 3px 0 0 var(--critical)}
.relief{color:var(--relief)} .pressure{color:var(--pressure)} .neutral{color:var(--muted)}
.legend{display:flex;gap:14px;font-size:.78rem;margin-top:10px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:currentColor}
.detail{padding:12px 14px 14px;border-top:1px dashed var(--line);font-size:.82rem;color:var(--muted);display:grid;gap:8px}
.detail a{color:var(--accent)}

/* Tools */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;margin-top:12px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label.f{display:grid;gap:4px;font-size:.78rem;color:var(--muted)}
label.f input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);font-family:var(--mono);font-size:1rem;width:100%}
.out{display:grid;gap:4px;background:var(--sunk);border-radius:10px;padding:12px}
.out .big{font-family:var(--mono);font-size:1.4rem}
.out small,.note{color:var(--muted);font-size:.8rem;margin:0}

/* Agenda */
.agenda{list-style:none;margin:0;padding:0}
.agenda li{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.94rem}
.agenda li:last-child{border-bottom:0}
.otd-h{margin:18px 0 2px;font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.otd-h span{font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted);font-size:.78rem}
#otd .agenda li{grid-template-columns:78px 1fr}
#otd .empty{padding:8px 0 4px}
.ag-in{color:var(--muted);font-size:.84rem}
.aotd{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;margin-top:14px;display:grid;gap:12px}
.aotd h3{font-family:var(--display);font-size:clamp(1.5rem,6.6vw,2.1rem);line-height:1.12;margin:0;font-weight:700;text-wrap:balance}
.aotd .meta{font-size:.8rem;color:var(--muted)}
.aotd .why{margin:0;font-size:.95rem}
.aotd .why b{color:var(--accent)}
.aotd .btn{justify-self:start}
.otd li{font-size:.9rem;line-height:1.45}
.agenda .d{font-family:var(--mono);font-size:.82rem;color:var(--accent);font-weight:600}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:grid;place-items:center;gap:2px;padding:9px 2px 8px;font-size:.7rem;font-weight:600;color:var(--muted);text-decoration:none}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:22px;height:22px}
.view[hidden],.sheet[hidden]{display:none}
.view:not([hidden]){animation:viewIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#refresh.spin svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 8px);z-index:60;transform:translate(-50%,-70px);width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.15);display:grid;place-items:center;color:var(--accent);transition:transform .2s;pointer-events:none}
.ptr svg{width:18px;height:18px}.ptr.go svg{animation:spin .8s linear infinite}
.toast-up{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.85rem;font-weight:600;z-index:70;animation:toast 1.8s ease forwards;pointer-events:none}
@media (prefers-reduced-motion:reduce){.view:not([hidden]){animation:none}}

/* Sheet + toast */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(5,10,12,.5);display:grid;align-items:end}
.sheet .box{background:var(--surface);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-width:640px;width:100%;margin:0 auto;display:grid;gap:12px}
.sheet h3{margin:0;font-family:var(--display);font-size:1.25rem}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:9px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.85rem;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
footer{color:var(--muted);font-size:.76rem;padding:30px 0 0}
/* Flipboard-style pager: one page of stories at a time, the page folds along its middle */
.flip{position:relative;perspective:1800px;margin-top:12px;touch-action:none;user-select:none;-webkit-user-select:none}
.fp{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;padding:16px 18px}
.half{position:absolute;left:0;right:0;height:50%;overflow:hidden}
.half.top{top:0}.half.bot{bottom:0}
.half>.fp{inset:auto;left:0;right:0}
.leaf{position:absolute;left:0;right:0;height:50%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.25,.1,.2,1);z-index:3}
.leaf .face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf .face.back{transform:rotateX(180deg)}
.leaf .face>.fp{inset:auto;left:0;right:0}
.shade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .6s;pointer-events:none;z-index:2}
.fp-head{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent);padding-bottom:10px;border-bottom:2px solid var(--text)}
.fp-head span:last-child{color:var(--muted);letter-spacing:.04em}
.fp-lead{padding:16px 0 14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.fp-lead h3{font-family:var(--display);font-size:clamp(1.45rem,6.4vw,2rem);line-height:1.12;margin:0;font-weight:700;text-wrap:balance}
.fp-sm{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:4px}
.fp-sm:last-of-type{border-bottom:0}
.fp-sm h3{font-size:1.02rem;line-height:1.32;margin:0;font-weight:600;text-wrap:balance}
.fp h3 a{text-decoration:none}
.fp .meta{font-size:.74rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.fp .meta .src{font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.04em;font-size:.7rem}
.fp .acts{display:flex;justify-content:space-between;align-items:center}
.fp .read{font-size:.84rem;font-weight:600;color:var(--accent);text-decoration:none}
.fp-foot{margin-top:auto;padding-top:10px;text-align:center;font-size:.74rem;color:var(--muted)}
.dots{display:flex;justify-content:center;gap:5px;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:16px;border-radius:3px}
@media (prefers-reduced-motion:reduce){.leaf,.shade{transition:none}}
.skel{height:14px;border-radius:6px;background:var(--sunk);margin:10px 0}
@media (max-width:370px){.fields{grid-template-columns:1fr}.mrow{grid-template-columns:1fr 92px}.mrow svg{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  return `<div class="nv" style="background:${c[1]}"><span class="nv-fl">${fl}</span>${f?`<b class="nv-fig">${esc(f)}</b>`:""}${n.img?`<img src="${esc(n.img)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">`:""}</div>`;}
function nxTi(n){return (n.t&&n.t[lang])||(lang==="ar"&&n.t&&n.t.en)||n.title;}
function nxDs(n){return cleanDl((n.d&&n.d[lang])||(lang==="ar"&&n.d&&n.d.en)||n.desc);}
function nxFlags(n){const fr=lang==="fr",isRead=!!NX.read[nxId(n)],isNew=!isRead&&new Date(n.date).getTime()>NX.prev;
  return isRead?`<span class="nf ok">✓ ${(lang==="ar"?"مقروء":fr?"Lu":"Read")}</span>`:isNew?`<span class="nf nw">${(lang==="ar"?"جديد":fr?"Nouveau":"New")}</span>`:"";}
function nxSrc(n,withCat){const ctry=countriesOf(n).map(c=>L3(c)).slice(0,1)[0];
  return `<div class="nk">${nxSa(n.source)}<span class="nk-s">${isFollowed(n)?'<b class="fw-s">★</b> ':""}${esc(n.source)}</span><span class="nk-t">${withCat?`<em style="color:${catColor(n.cat)}">${esc(catLabel(n.cat))}</em> · `:""}${ctry?esc(ctry)+" · ":""}${ago(n.date)}</span></div>`;}
function nxRow(n,lead,num,withCat){
  const isRead=!!NX.read[nxId(n)],href=`href="${esc(n.url)}" target="_blank" rel="noopener" data-nid="${esc(nxId(n))}"`,ds=nxDs(n);
  if(lead)return `<a class="nfe${isRead?" read":""}" ${href} style="--cc:${catColor(n.cat)}">${nxArt(n,true)}<div class="nfe-b">${nxSrc(n,withCat)}<h3>${esc(nxTi(n))}</h3>${ds?`<p class="nc-d">${esc(ds)}</p>`:""}<div class="nfe-f">${nxFlags(n)}<span class="nfe-r">${(lang==="ar"?"اقرأ":lang==="fr"?"Lire":"Read")} ↗</span></div></div></a>`;
  return `<a class="nrw${isRead?" read":""}" ${href}><div class="nrw-th">${nxArt(n,false)}${num?`<span class="nrw-n">${num}</span>`:""}</div><div class="nrw-b">${nxSrc(n,withCat)}<h3>${esc(nxTi(n))}</h3>${nxFlags(n)?`<div class="nrw-f">${nxFlags(n)}</div>`:""}</div></a>`;
}
function nxCar(items){const fr=lang==="fr";
  return `<div class="tsh"><h4>${(lang==="ar"?"أبرز الأخبار":fr?"À la une":"Top stories")}</h4><span>${(lang==="ar"?"اسحب ←":fr?"Glissez →":"Swipe →")}</span></div>
  <div class="tsc" id="tsc">${items.map((n,k)=>{const c=REEL_CATS[n.cat]||REEL_CATS.worldwide,isRead=!!NX.read[nxId(n)];
    return `<a class="tsk${isRead?" read":""}" href="${esc(n.url)}" target="_blank" rel="noopener" data-nid="${esc(nxId(n))}">${nxArt(n,true)}<div class="tsk-o"></div>
      <div class="tsk-b"><span class="tsk-c" style="background:${catColor(n.cat)}">${c[0]} ${esc(catLabel(n.cat))}</span>${isRead?`<span class="tsk-r">✓</span>`:""}
      <h3>${esc(nxTi(n))}</h3><div class="tsk-m">${esc(n.source)} · ${ago(n.date)}</div></div></a>`;}).join("")}</div>
  <div class="tsd" id="tsd">${items.map((x,k)=>`<i class="${k?"":"on"}"></i>`).join("")}</div>`;}
function nxBlock(c,l,skipLead){
  const fr=lang==="fr",r=l.filter(n=>NX.read[nxId(n)]).length,ic=(REEL_CATS[c.id]||REEL_CATS.worldwide)[0],done=r===l.length;
  let h=`<button type="button" class="nsh" data-go="${c.id}" style="--cc:${catColor(c.id)}"><span class="nsh-i">${ic}</span><h4>${esc(c[lang]||c.en)}</h4><span class="nsh-p${done?" done":""}">${done?"✓ ":""}${r}/${l.length}</span><span class="nsh-a">›</span></button>`;
  (skipLead?l.slice(1):l).forEach((n,i)=>h+=nxRow(n,!skipLead&&i===0,skipLead?i+2:(i?i+1:0),false));
  return `<section class="nsb">${h}</section>`;
}
function renderNews(){
  const fr=lang==="fr",all=[...B.news].sort((a,b)=>b.date.localeCompare(a.date));
  const TOP=5,top={},rank=(a,b)=>(b.score||0)-(a.score||0)||b.date.localeCompare(a.date);
  B.categories.forEach(c=>top[c.id]=all.filter(n=>n.cat===c.id).sort(rank).slice(0,TOP));
  const pool=B.categories.flatMap(c=>top[c.id]);
  const unseen=pool.filter(n=>!NX.read[nxId(n)]&&new Date(n.date).getTime()>NX.prev);
  nxHabit(unseen.length);
  if(cat==="ite")cat="all";
  const cats=[{id:"all",en:t("all"),fr:t("all"),ar:t("all")},{id:"follow",en:"★ Following",fr:"★ Suivis",ar:"★ متابَعة"},...B.categories];
  $("#chips").innerHTML=cats.map(c=>{const n=c.id==="all"?unseen.length:unseen.filter(x=>x.cat===c.id).length;
    return `<button class="chip" type="button" data-cat="${c.id}" aria-pressed="${cat===c.id}">${esc(c[lang]||c.en)}${n?`<span class="n">${n}</span>`:""}</button>`;}).join("");
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;renderNews();});
  const qi=$("#nx-q");qi.placeholder=(lang==="ar"?"ابحث: BEAC، النفط، سندات اليورو…":fr?"Rechercher : BEAC, pétrole, Eurobond…":"Search: BEAC, oil, Eurobond…");
  const sb=$("#nx-sbox");if(!$("#nx-sbtn").dataset.w){$("#nx-sbtn").dataset.w=1;
    $("#nx-sbtn").onclick=()=>{sb.hidden=!sb.hidden;if(!sb.hidden)qi.focus();};
    $("#nx-sx").onclick=()=>{qi.value="";NX.q="";sb.hidden=true;renderNews();};}
  if(NX.q)sb.hidden=false;
  if(!qi.dataset.w){qi.dataset.w=1;let tm=0;qi.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>{NX.q=qi.value.trim();renderNews();},180);};}
  const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  let html="";
  if(NX.q){const q=norm(NX.q);const l=all.filter(n=>(cat==="all"||n.cat===cat)&&norm(n.title+" "+((n.t&&n.t.en)||"")+" "+((n.t&&n.t.fr)||"")+" "+n.source+" "+ctryWords(n)).includes(q)).slice(0,20);
    if(!l.length){$("#nx-list").innerHTML=`<p class="empty">${(lang==="ar"?"لا توجد أخبار مطابقة.":fr?"Aucun article ne correspond.":"No stories match.")}</p>`;return;}
    html=`<div class="ns2"><h4>${(lang==="ar"?"النتائج":fr?"Résultats":"Results")}</h4><span>${l.length}</span></div>`+l.map((n,i)=>nxRow(n,false,i+1,true)).join("");}
  else if(cat==="follow"){
    const F=followList(),l=all.filter(isFollowed).sort((a,b)=>(b.score||0)-(a.score||0)||b.date.localeCompare(a.date)).slice(0,20);
    html=`<div class="fw"><div class="fw-l">${F.map((w,k)=>`<span class="fw-c">${esc(w)}<button type="button" data-fx="${k}" aria-label="${(lang==="ar"?"إزالة":fr?"Retirer":"Remove")} ${esc(w)}">×</button></span>`).join("")}</div>
      <form class="fw-add" id="fw-add"><input id="fw-in" type="text" autocomplete="off" placeholder="${(lang==="ar"?"أضف موضوعًا: BEAC، لبنان، الكاكاو…":fr?"Ajouter un sujet : BEAC, Liban, cacao…":"Add a topic: BEAC, Lebanon, cocoa…")}"><button type="submit">${(lang==="ar"?"متابعة":fr?"Suivre":"Follow")}</button></form></div>`;
    html+=l.length?`<div class="ns2"><h4>${(lang==="ar"?"مواضيعك":fr?"Vos sujets":"Your topics")}</h4><span>${l.length}</span></div>`+l.map((n,i)=>nxRow(n,i===0,i+1,true)).join(""):`<p class="empty">${(lang==="ar"?"لا أخبار عن مواضيعك حاليًا.":fr?"Aucun article sur vos sujets pour le moment.":"No stories on your topics right now.")}</p>`;
    $("#nx-list").innerHTML=html;
    $("#nx-list").querySelectorAll("[data-fx]").forEach(b=>b.onclick=()=>{const F=followList();F.splice(+b.dataset.fx,1);store.set("follow",F);renderNews();});
    $("#fw-add").onsubmit=e=>{e.preventDefault();const v=$("#fw-in").value.trim();if(v&&v.length<40){const F=followList();if(!F.some(x=>x.toLowerCase()===v.toLowerCase()))F.push(v);store.set("follow",F);}renderNews();};
    $("#nx-list").querySelectorAll("[data-nid]").forEach(a=>a.onclick=()=>{const n=all.find(x=>nxId(x)===a.dataset.nid);if(n){nxMarkRead(n);setTimeout(()=>{renderNews();renderSixty();},400);}});
    return;
  }
  else{
    const cs=cat==="all"?B.categories:B.categories.filter(c=>c.id===cat);
    const lead=cat==="all"?cs.map(c=>top[c.id][0]).filter(Boolean):[];
    if(lead.length)html+=nxCar(lead);
    cs.forEach(c=>{if(top[c.id].length>(cat==="all"?1:0))html+=nxBlock(c,top[c.id],cat==="all");});
    if(!html){$("#nx-list").innerHTML=`<p class="empty">${t("nostories")}</p>`;return;}
    const sc=cs.flatMap(c=>top[c.id]),left=sc.filter(n=>!NX.read[nxId(n)]).length,nx=nxNext();
    const nxt=nx?nx.toLocaleTimeString((lang==="ar"?"ar-u-nu-latn":fr?"fr-FR":"en-GB"),{hour:"2-digit",minute:"2-digit"}):"";
    html+=`<div class="nd-end">${left?`<b>${(lang==="ar"?`${left} متبقية للقراءة`:fr?`Encore ${left} à lire`:`${left} left to read`)}</b><span>${(lang==="ar"?"أهم العناوين، 5 في كل قسم.":fr?"Les titres essentiels, 5 par rubrique.":"The essential headlines, 5 per section.")}</span>`:`<b>✅ ${(lang==="ar"?"قرأت كل شيء. أحسنت!":fr?"Tout lu. Bravo !":"All caught up. Well done!")}</b><span>${nxt?((lang==="ar"?`عناوين جديدة حوالي ${nxt}.`:fr?`Nouveaux titres vers ${nxt}.`:`Fresh headlines around ${nxt}.`)):""}</span>`}</div>`;
  }
  $("#nx-list").innerHTML=html;
  $("#nx-list").querySelectorAll("[data-nid]").forEach(a=>a.onclick=()=>{const n=all.find(x=>nxId(x)===a.dataset.nid);if(n){nxMarkRead(n);setTimeout(()=>{renderNews();renderSixty();},400);}});
  $("#nx-list").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{cat=b.dataset.go;renderNews();scrollTo({top:0,behavior:"smooth"});});
  const tc=$("#tsc");if(tc){const d=[...$("#tsd").children];tc.onscroll=()=>{const w=tc.firstElementChild.offsetWidth+12,k=Math.round(Math.abs(tc.scrollLeft)/w);d.forEach((e,j)=>e.classList.toggle("on",j===k));};}
}
(function(){
  let y0=null,x0=0,t0=0;
  document.addEventListener("pointerdown",e=>{if(!e.target.closest("#flip"))return;y0=e.clientY;x0=e.clientX;t0=Date.now();});
  document.addEventListener("pointerup",e=>{if(y0===null)return;const dy=e.clientY-y0,dx=e.clientX-x0;y0=null;
    if(Math.abs(dy)>40&&Math.abs(dy)>Math.abs(dx))flipTo(dy<0?1:-1);});
  let wl=0;document.addEventListener("wheel",e=>{if(!e.target.closest("#flip"))return;e.preventDefault();const now=Date.now();if(now-wl<700||Math.abs(e.deltaY)<15)return;wl=now;flipTo(e.deltaY>0?1:-1);},{passive:false});
  document.addEventListener("keydown",e=>{if($("#v-news").hidden||!$("#flip"))return;if(e.key==="ArrowDown"||e.key==="PageDown"){e.preventDefault();flipTo(1);}if(e.key==="ArrowUp"||e.key==="PageUp"){e.preventDefault();flipTo(-1);}});
  addEventListener("resize",()=>{if(B&&$("#flip")&&!$("#v-news").hidden&&!fBusy)drawFlip();});

let sid=null,sdir="above";
function openSheet(id){const m=M(id);sid=id;const a=alerts[id]||{dir:"above",v:+m.value.toFixed(m.dp)};sdir=a.dir;
  $("#sheet-h").textContent=`${m.name} · ${fmt(m.value,m.dp)}`;$("#sheet-val").value=a.v;syncDir();$("#sheet").hidden=false;}
function syncDir(){$("#dir-above").setAttribute("aria-pressed",sdir==="above");$("#dir-below").setAttribute("aria-pressed",sdir==="below");}
$("#dir-above").onclick=()=>{sdir="above";syncDir();};$("#dir-below").onclick=()=>{sdir="below";syncDir();};
$("#sheet-cancel").onclick=()=>$("#sheet").hidden=true;
$("#sheet").onclick=e=>{if(e.target.id==="sheet")$("#sheet").hidden=true;};
$("#sheet-save").onclick=()=>{alerts[sid]={dir:sdir,v:num($("#sheet-val").value)};store.set("alerts",alerts);$("#sheet").hidden=true;renderAll();toast("✓");};

function applyText(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("#lang").textContent=lang==="en"?"FR":lang==="fr"?"ع":"EN";
  if(theme)document.documentElement.dataset.theme=theme;else delete document.documentElement.dataset.theme;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
}
function renderAll(){applyText();if(!B)return;renderTop();renderHero();renderSixty();renderFront();renderOTD();renderAgenda();renderMarkets();renderNews();renderRead();}
$("#lang").onclick=()=>{lang=lang==="en"?"fr":lang==="fr"?"ar":"en";store.set("lang",lang);renderAll();};
$("#theme").onclick=()=>{const dark=theme?theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;theme=dark?"light":"dark";store.set("theme",theme);renderAll();};

const V=["today","events","markets","news","read"];
function route(){const v=V.includes(location.hash.slice(1))?location.hash.slice(1):"today";
  V.forEach(n=>$("#v-"+n).hidden=n!==v);document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===v?"page":"false"));
  scrollTo(0,0);if(v==="news"&&B)renderNews();}
addEventListener("hashchange",route);

applyText();route();
let lastLoad=0,loading=false;
async function load(manual){
  if(loading)return;loading=true;const rb=$("#refresh");if(rb)rb.classList.add("spin");
  const before=B&&B.generated_at;
  try{const r=await fetch("data/brief.json?ts="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;B=await r.json();store.set("last",B);offline=false;}
  catch(e){B=B||store.get("last",null);offline=true;if(!B){$("#banner-text").textContent="Couldn't load the brief. Check your connection and reopen the app.";loading=false;if(rb)rb.classList.remove("spin");return;}}
  if(B&&B.categories){const O=["worldwide","africa","congo","lebanon"],r=id=>{const i=O.indexOf(id);return i<0?O.length:i;};B.categories=B.categories.map((c,i)=>[c,i]).sort((a,b)=>r(a[0].id)-r(b[0].id)||a[1]-b[1]).map(x=>x[0]);}
  lastLoad=Date.now();renderAll();loading=false;if(rb)rb.classList.remove("spin");
  if(manual){const t=document.createElement("div");t.className="toast-up";t.textContent=offline?((lang==="ar"?"غير متصل · عرض آخر نسخة":lang==="fr"?"Hors ligne · dernière version affichée":"Offline · showing the last version")):before&&before===B.generated_at?((lang==="ar"?"محدّث بالفعل ✓":lang==="fr"?"Déjà à jour ✓":"Already up to date ✓")):((lang==="ar"?"تم التحديث ✓":lang==="fr"?"Mis à jour ✓":"Updated ✓"));document.body.appendChild(t);setTimeout(()=>t.remove(),1900);}
}
load();
$("#refresh").onclick=()=>load(true);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&Date.now()-lastLoad>2*60e3)load();});

(()=>{const p=document.createElement("div");p.className="ptr";p.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>';document.body.appendChild(p);
  let y0=null,dy=0;

  addEventListener("touchend",async()=>{if(y0===null)return;y0=null;if(dy>90){p.classList.add("go");p.style.transform="translate(-50%,0)";await load(true);}p.classList.remove("go");p.style.transform="";dy=0;});
})();
