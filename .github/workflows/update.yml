name: Update Business Desk

on:
  schedule:
    - cron: "15 5-21 * * *"   # every hour at :15, 06:15 to 22:15 Brazzaville
  workflow_dispatch: {}    # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: update-brief
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build today's brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: node scripts/update.mjs
      - name: Record the Morning Brief (natural voices)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          npm install --no-save --no-audit --no-fund msedge-tts@2.1.1 >/dev/null 2>&1 || exit 0
          node scripts/tts.mjs || true
      - name: Save the brief
        run: |
          git config user.name "business-desk-bot"
          git config user.email "business-desk-bot@users.noreply.github.com"
          git add data/brief.json data/*.mp3 2>/dev/null || git add data/brief.json
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Brief $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase -q || true
          git push
